name: Build online documentation

permissions:
  contents: write

# Run on any push. Change later
on: push

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          path: main
          fetch-depth: 0

      - uses: actions/checkout@v3
        with:
            path: online-docs
            ref: online-docs
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Generate Markdown docs
        working-directory: main
        run: Rscript .meta/DEVTOOLS/build_md.R

      - name: Sync docs folder
        run: |
         rm -rf online-docs/*
         cp -R main/md_docs/* online-docs/

      - name: Commit & push to online-docs
        working-directory: online-docs
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git add .
           git commit -m "chore: sync docs from main" || echo "No changes to commit"
           git push origin online-docs --force
