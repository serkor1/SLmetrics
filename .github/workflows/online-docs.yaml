name: Gitbook

permissions:
  contents: write

on:
    push:
        paths:
            - 'NEWS.md'
            - 'man/**'
            - '.meta/development_tools/**'
            - '.meta/documentation/**'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          path: main
          fetch-depth: 0

      - uses: actions/checkout@v3
        with:
            path: online-docs
            ref: online-docs
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0
            
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
            r-version: 'release'

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Build Gitbook
        working-directory: main
        run: make build-gitbook

      - name: Synchronize
        run: |
          rsync -av --delete \
            --filter='P .git/' \
            --exclude='.*' \
            main/.meta/documentation/gitbook/ \
            online-docs/

      - name: Commit & push to online-docs
        working-directory: online-docs
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git add .
           git commit -m ":books: Updated online docs" || echo "No changes to commit ¯\_(ツ)_/¯"
           git push origin online-docs --force
