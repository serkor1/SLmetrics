name: Gitbook

permissions:
  contents: write

on:
    push:
        paths:
            - 'NEWS.md'
            - 'man/**'
            - '.meta/DEVTOOLS/**'
            - '.meta/DOCUMENTATION/**'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          path: main
          fetch-depth: 0

      - uses: actions/checkout@v3
        with:
            path: online-docs
            ref: online-docs
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
            tinytex: true
    
    
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
            r-version: 'release'

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install {Quarto}
        shell: bash
        run: |
            Rscript -e "install.packages(c('knitr', 'rmarkdown'), dependencies = FALSE)"

      - name: Generate Markdown docs
        working-directory: main
        run: make build-docs

      - name: Sync docs folder
        run: |
          rsync -av --delete \
            --filter='P .git/' \
            --exclude='.*' \
            main/.meta/DOCUMENTATION/gitbook/ \
            online-docs/

      - name: Commit & push to online-docs
        working-directory: online-docs
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
           git config user.name "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           git add .
           git commit -m ":books: Updated online docs" || echo "No changes to commit ¯\_(ツ)_/¯"
           git push origin online-docs --force
